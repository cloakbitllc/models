name: Sync upstream catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/router-for-me/models.git
          git fetch upstream main
          # Fails on conflict; resolve manually when upstream adds an entry we carried early.
          git merge --no-edit upstream/main
          git push origin main
